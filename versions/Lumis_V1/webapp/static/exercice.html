<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entraînement — Lumis</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/exercice.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand"><img src="assets/logo.svg" alt=""> Lumis</a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg><span>Dashboard</span></a>
      <a href="chapitres.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg><span>Chapitres</span></a>
      <a href="exercice.html" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6.5 6.5 11 11M14.5 3.5l6 6-3 3-6-6 3-3ZM3.5 14.5l6 6-3 3-6-6 3-3Z"/></svg><span>Entraînement</span></a>
      <a href="profil.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><span>Profil</span></a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème" style="align-self:flex-start;">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Entraînement</h1>
        <p style="color:var(--text-muted); margin-top:6px;" id="level-line">Chargement de ton niveau...</p>
      </div>
    </div>

    <div class="mode-pills" id="mode-pills">
      <button class="mode-pill active" data-mode="libre">Libre</button>
      <button class="mode-pill" data-mode="revisions">Révisions</button>
      <button class="mode-pill" data-mode="objectif">Objectif du jour</button>
      <button class="mode-pill" data-mode="examen">Examen blanc</button>
      <button class="mode-pill" data-mode="chrono">Défi chronométré</button>
      <button class="mode-pill" data-mode="erreurs">Erreurs précédentes</button>
      <button class="mode-pill" data-mode="faibles">Notions faibles</button>
      <button class="mode-pill" data-mode="favoris">Favoris</button>
    </div>

    <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:2; min-width:320px;">
        <section id="empty-state" class="card" style="padding:40px; text-align:center;">
          <p style="color:var(--text-muted);">Choisis un mode, puis clique sur « Nouvel exercice » pour commencer.</p>
          <button id="btn-next-ex" class="btn btn-primary" style="margin-top:16px;">🎲 Nouvel exercice</button>
        </section>

        <section id="screen-ex" class="question-card card" hidden>
          <div class="question-badges">
            <span class="badge badge--indigo" id="ex-chapter-badge"></span>
            <span class="badge badge--neutral" id="ex-notion-badge"></span>
            <span class="xp-pill" id="ex-xp-badge">+10 XP</span>
            <span class="badge badge--warning" id="ex-chrono-badge" hidden></span>
            <button id="btn-fav" class="btn btn-ghost btn-sm" style="margin-left:auto;" title="Ajouter aux favoris">☆</button>
          </div>
          <div id="ex-enonce" class="question-enonce"></div>

          <div class="action-row">
            <button id="btn-hint" class="btn btn-secondary btn-sm">💡 Indice</button>
            <button id="btn-method" class="btn btn-secondary btn-sm">🧭 Voir la méthode</button>
            <button id="btn-sol" class="btn btn-secondary btn-sm">👁 Solution</button>
          </div>
          <div id="ex-hint" class="callout" hidden></div>
          <div id="ex-method" class="callout callout--steps" hidden></div>
          <div id="ex-sol" class="callout" hidden></div>

          <div class="verdict-row">
            <button id="ex-btn-no" class="btn btn-secondary">❌ Échoué</button>
            <button id="ex-btn-yes" class="btn btn-primary">✅ Réussi</button>
          </div>
        </section>
      </div>

      <aside style="flex:1; min-width:260px;">
        <div class="card" style="padding:20px;">
          <h3 style="font-size:0.95rem; margin-bottom:14px;">Historique récent</h3>
          <div class="history-strip" id="history-strip"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script type="module" src="js/exercice.js"></script>
</body>
</html>
