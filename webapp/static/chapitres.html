<div class="app-shell">
  <aside class="sidebar">
    <a href="/" class="brand"><img src="assets/logo.svg" alt=""> <span class="brand-name">NovaMath</span></a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5Z"/></svg><span data-i18n="nav.dashboard">Dashboard</span></a>
      <a href="chapitres.html" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 2 2 3-3"/><path d="M11 6h10"/><path d="m3 13 2 2 3-3"/><path d="M11 13h10"/><path d="m3 20 2 2 3-3"/><path d="M11 20h10"/></svg><span data-i18n="nav.exercices">Exercices</span></a>
      <a href="cours.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg><span data-i18n="nav.cours">Cours</span></a>
      <a href="exercice.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="8" width="4" height="8" rx="1.5"/><rect x="18" y="8" width="4" height="8" rx="1.5"/><line x1="6" y1="12" x2="18" y2="12"/></svg><span data-i18n="nav.entrainement">Entraînement</span></a>
      <a href="chatbot.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg><span data-i18n="nav.chatbot">Chatbot</span></a>
      <a href="abonnement.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5 6 11l3-6 3 6 3-6 3 6 3.5-2.5-1.5 10h-15Z"/></svg><span data-i18n="nav.abonnement">Abonnement</span></a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-settings-btn" id="settings-btn" aria-label="Paramètres" data-tooltip="Paramètres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3.17 14H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.13.47.42.88.82 1.15.3.2.65.31 1.02.32H21a2 2 0 1 1 0 4h-.09c-.37.01-.72.12-1.02.32-.4.27-.69.68-.82 1.15Z"/></svg>
        <span data-i18n="settings.title">Paramètres</span>
      </button>
      <a href="profil.html" class="sidebar-user" id="sidebar-user">
        <span class="sidebar-user-avatar" id="sidebar-user-avatar"></span>
        <span class="sidebar-user-info">
          <span class="name" id="sidebar-user-name">Élève</span>
          <span class="sub" id="sidebar-user-plan">Free</span>
        </span>
      </a>
    </div>
    <div class="sidebar-version" id="sidebar-version"></div>
  </aside>

  <main class="main-content reveal-stagger">
    <div class="page-header">
      <div>
        <h1>Exercices</h1>
        <p id="chapters-page-subtitle" style="color:var(--text-muted); margin-top:6px;">Choisis les chapitres à évaluer, ou explore ta progression par notion.</p>
      </div>
    </div>

    <div class="card" id="resume-card" style="padding:24px; margin-bottom:24px;" hidden></div>

    <div class="page-search" role="search">
      <span class="page-search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input type="text" id="chapters-search-input" class="page-search-input" placeholder="Rechercher un chapitre, une notion ou un exercice…" aria-label="Rechercher un chapitre, une notion ou un exercice" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="chapters-search-results">
      <button type="button" class="page-search-clear" id="chapters-search-clear" aria-label="Effacer la recherche" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="page-search-results" id="chapters-search-results" role="listbox" aria-label="Résultats de recherche" hidden></div>

    <div class="chapter-filter-bar" id="chapter-filter-bar" role="tablist" aria-label="Filtrer les chapitres">
      <button type="button" class="chapter-filter-pill active" data-filter="all" role="tab" aria-selected="true">Tout</button>
      <button type="button" class="chapter-filter-pill" data-filter="ongoing" role="tab" aria-selected="false">Reprendre</button>
      <button type="button" class="chapter-filter-pill" data-filter="mastered" role="tab" aria-selected="false">Maîtrisé</button>
      <button type="button" class="chapter-filter-pill" data-filter="unmastered" role="tab" aria-selected="false">Non maîtrisé</button>
      <button type="button" class="chapter-filter-pill" data-filter="saved" role="tab" aria-selected="false">Enregistrés</button>
    </div>

    <div id="chapters-grid" class="chapters-grid reveal-stagger">
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
    </div>
    <p class="chapters-empty-filter" id="chapters-empty-filter" hidden></p>
  </main>
</div>

<script type="module" src="js/identity.js"></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/command-palette.js"></script>
<script type="module" src="js/chapitres.js"></script>
</body>
</html>
