<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administration — Mathadap</title>
    <meta name="application-name" content="Mathadap" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div class="admin-sidebar-overlay" id="admin-sidebar-overlay" hidden></div>

      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-sidebar-brand">
          <span class="admin-topbar-brand">Mathadap</span>
          <span class="admin-topbar-sep">/</span>
          <span>Admin</span>
        </div>
        <nav class="admin-sidebar-nav" id="admin-sidebar-nav" aria-label="Navigation Administration">
          <span class="admin-sidebar-skeleton admin-skeleton"></span>
          <span class="admin-sidebar-skeleton admin-skeleton"></span>
          <span class="admin-sidebar-skeleton admin-skeleton"></span>
        </nav>
      </aside>

      <div class="admin-shell-main">
        <header class="admin-header">
          <button type="button" class="admin-sidebar-toggle" id="admin-sidebar-toggle" aria-label="Ouvrir le menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>

          <nav class="admin-breadcrumb" id="admin-breadcrumb" aria-label="Fil d'Ariane"></nav>

          <div class="admin-header-actions">
            <a href="/dashboard.html" class="admin-back-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
              </svg>
              <span>Retour à Mathadap</span>
            </a>

            <div class="admin-header-identity" id="admin-identity">
              <span class="admin-identity-skeleton admin-skeleton"></span>
            </div>
          </div>
        </header>

        <main class="admin-content" id="admin-content">
          <span class="admin-banner admin-banner--error" id="admin-global-error" hidden></span>
          <div id="admin-content-body"></div>
        </main>
      </div>
    </div>

    <!-- Contenu du module Dashboard (voir admin-dashboard.js) — cloné dans
     #admin-content-body uniquement quand ce module est actif. Refonte UX
     (audit round 2) : 4 cartes réellement décisionnelles (Santé, Support,
     IA, Utilisateurs actifs) + les alertes métier, déplacées depuis
     /admin/analytics (seul endroit où elles existent désormais) — voir
     admin_dashboard_service.py pour le détail des cartes retirées
     (total utilisateurs, nouveaux 24h, répartition par plan, flux
     d'activité brute : aucune ne permettait de décision en <30s). -->
    <template id="admin-dashboard-template">
      <div class="admin-page-head">
        <h1>Vue d'ensemble</h1>
        <p class="admin-page-lead">Ce qui a besoin de ton attention aujourd'hui.</p>
      </div>
      <section class="admin-cards" id="admin-cards" aria-label="Indicateurs clés"></section>
      <section class="admin-activity" aria-label="Alertes">
        <h2>Alertes</h2>
        <div id="admin-activity-body"></div>
      </section>
    </template>

    <!-- Contenu du module Utilisateurs (voir admin-users.js) — lecture seule,
     aucune action de modification (pas de bouton supprimer/modifier/
     suspendre/réinitialiser/changer d'abonnement ou de rôle). -->
    <template id="admin-users-template">
      <div class="admin-page-head">
        <h1>Utilisateurs</h1>
        <p class="admin-page-lead">Annuaire en lecture seule des comptes Mathadap.</p>
      </div>
      <div class="admin-users-toolbar">
        <div class="admin-users-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            id="admin-users-search-input"
            placeholder="Rechercher un nom, un email…"
            aria-label="Rechercher un utilisateur"
          />
        </div>
        <div class="admin-users-filters">
          <select id="admin-users-filter-plan" aria-label="Filtrer par abonnement"></select>
          <select id="admin-users-filter-role" aria-label="Filtrer par rôle"></select>
          <select id="admin-users-filter-status" aria-label="Filtrer par statut"></select>
          <!-- Chantier de simplification (audit utilité/densité) : remplace le
           <select> à une seule option réelle ("Paiement en échec") par une
           case à cocher — le filtre backend reste strictement identique
           (payment_status=failed, voir admin_users_service.py). -->
          <label class="admin-form-checkbox-row" for="admin-users-filter-payment">
            <input type="checkbox" id="admin-users-filter-payment" aria-label="Filtrer les paiements en échec" />
            Paiement en échec
          </label>
        </div>
      </div>
      <div class="admin-users-table-wrap">
        <table class="admin-users-table" id="admin-users-table">
          <thead>
            <tr id="admin-users-thead-row"></tr>
          </thead>
          <tbody id="admin-users-tbody"></tbody>
        </table>
      </div>
      <p class="admin-empty" id="admin-users-empty" hidden></p>
      <nav class="admin-users-pagination" id="admin-users-pagination" aria-label="Pagination des utilisateurs"></nav>
    </template>

    <!-- Contenu du sous-chemin /admin/users/:id — pas un module du menu, une
     sous-page du module Utilisateurs (voir admin-shell.js et
     admin-user-profile.js pour la logique des 4 onglets à chargement
     paresseux : Informations/Activité/Chatbot/Abonnement — Cours, Exercices
     et Apprentissage sont repliés en sous-sections sous "Activité"). -->
    <template id="admin-user-profile-template">
      <div class="admin-user-profile-head" id="admin-user-profile-head">
        <span class="admin-avatar admin-avatar--lg admin-skeleton"></span>
      </div>
      <nav class="admin-tabs" id="admin-user-profile-tabs" aria-label="Sections de la fiche utilisateur"></nav>
      <div class="admin-tab-panel" id="admin-user-profile-panel"></div>
    </template>

    <!-- Contenu du module IA (voir admin-ai.js) — panneau d'administration de la
     CONFIGURATION TECHNIQUE des fournisseurs IA : créer/modifier/activer-
     désactiver/supprimer un fournisseur, réordonner les priorités, tester un
     fournisseur et lancer un health-check. 4 cartes : Fournisseurs IA (avec
     provider_key/modèle en sous-ligne), État des fournisseurs, Consommation
     IA, Clés API. L'assignation fournisseur ⇄ plan d'abonnement se gère
     désormais depuis /admin/subscriptions (voir admin-subscriptions.js). -->
    <template id="admin-ai-template">
      <div class="admin-page-head">
        <h1>Fournisseurs IA</h1>
        <p class="admin-page-lead">
          Configuration technique des fournisseurs IA réellement utilisés par le chatbot. L'assignation d'un fournisseur
          à un plan d'abonnement (Free/Premium/Ultra) se gère depuis la page
          <a href="/admin/subscriptions">Abonnements</a>.
        </p>
      </div>

      <section class="admin-section" aria-labelledby="admin-ai-providers-title">
        <div class="admin-section-head-row">
          <h2 class="admin-section-title" id="admin-ai-providers-title">Fournisseurs IA</h2>
          <button type="button" class="admin-btn admin-btn--primary" id="admin-ai-new-provider-btn">
            + Nouveau fournisseur
          </button>
        </div>
        <div class="admin-cards admin-ai-providers-grid" id="admin-ai-providers"></div>
      </section>

      <!-- Chantier Administrateur "IA" (Phase 2) : la carte "État des
       fournisseurs" a été retirée en tant que section indépendante — elle
       dupliquait presque intégralement l'onglet "État" de la fiche détaillée
       (/admin/ia/:id, voir admin-ai-provider.js). Les mêmes données de santé
       (GET /api/admin/ai/health, inchangée) alimentent désormais un badge
       compact directement sur chaque carte de la section "Fournisseurs IA"
       ci-dessus (voir admin-ai.js::providerHealthState/healthBadge) ; le
       détail complet reste à un clic, sur la fiche. -->

      <!-- Le graphique "Consommation journalière (tous fournisseurs)" a été
       retiré : il dupliquait la série "tokens_per_day" déjà présente dans
       Analytics (même table ai_provider_usage), même principe que les 6
       graphiques IA déjà retirés de la page Santé au profit d'un lien. Lien
       statique (même pattern que le lien "Abonnements" du paragraphe
       d'introduction ci-dessus) plutôt qu'un bouton JS : pas de nouvelle
       route, pas de nouveau câblage de navigation. -->
      <section class="admin-section" aria-labelledby="admin-ai-usage-title">
        <h2 class="admin-section-title" id="admin-ai-usage-title">
          Consommation IA — cumul à vie
          <!-- Audit admin (2026-10-22), point 4 : précision du périmètre exact de
           CE total (ai_provider_usage) — déplacée du paragraphe permanent
           ci-dessous vers une icône "i"/tooltip sur le titre, l'information
           reste accessible (au clavier via tabindex + au survol/tactile via
           title) sans occuper un espace permanent. Aucune donnée perdue. -->
          <span
            class="admin-info-icon"
            tabindex="0"
            role="img"
            aria-label="Précision sur le périmètre de ce total"
            title="Ce total ne couvre que les appels réellement envoyés à un fournisseur IA externe (Gemini/Claude/…) — jamais le moteur de réponses locales (bibliothèque de réponses statiques, aucun appel externe, aucun token)."
            >ⓘ</span
          >
        </h2>
        <p class="admin-page-lead">
          Total de tous les appels enregistrés depuis toujours pour chaque fournisseur (jamais une fenêtre glissante).
          Pour l'évolution dans le temps et les classements par période, voir <a href="/admin/analytics">Analytics</a>.
        </p>
        <h3 class="admin-analytics-subtitle">Détail par fournisseur</h3>
        <div class="admin-ai-usage-list" id="admin-ai-usage"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-ai-keys-title">
        <div class="admin-section-head-row">
          <h2 class="admin-section-title" id="admin-ai-keys-title">Clés API (haute disponibilité)</h2>
          <button type="button" class="admin-btn admin-btn--primary" id="admin-ai-new-key-btn">
            + Ajouter une clé
          </button>
        </div>
        <p class="admin-form-hint">
          Plusieurs clés par fournisseur, essayées dans l'ordre de priorité — en cas d'échec (quota, clé invalide,
          erreur réseau), la clé suivante est utilisée automatiquement avant de changer de modèle ou de fournisseur.
        </p>
        <div class="admin-ai-keys-list" id="admin-ai-keys"></div>
      </section>
    </template>

    <!-- Modale de création d'une clé API (voir admin-ai.js::openApiKeyModal). -->
    <div class="admin-modal-overlay" id="admin-ai-key-modal" hidden>
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-ai-key-modal-title">
        <div class="admin-modal-head">
          <h2 id="admin-ai-key-modal-title">Nouvelle clé API</h2>
          <button type="button" class="admin-modal-close" id="admin-ai-key-modal-close" aria-label="Fermer">×</button>
        </div>
        <div class="admin-modal-body" id="admin-ai-key-modal-body"></div>
      </div>
    </div>

    <!-- Modale de création/modification d'un fournisseur IA (voir admin-ai.js::
     openProviderModal) — un seul formulaire réutilisé pour les deux cas. -->
    <div class="admin-modal-overlay" id="admin-ai-provider-modal" hidden>
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-ai-provider-modal-title">
        <div class="admin-modal-head">
          <h2 id="admin-ai-provider-modal-title">Fournisseur IA</h2>
          <button type="button" class="admin-modal-close" id="admin-ai-provider-modal-close" aria-label="Fermer">
            &times;
          </button>
        </div>
        <div id="admin-ai-provider-modal-body"></div>
      </div>
    </div>

    <!-- Contenu du sous-chemin /admin/ia/:id — fiche détaillée d'un fournisseur,
     3 onglets à chargement paresseux (même architecture que
     admin-user-profile.js : une API par onglet, cache par onglet ;
     Informations fusionne les anciens onglets Informations générales +
     Configuration, strictement les mêmes champs). -->
    <template id="admin-ai-provider-template">
      <div class="admin-user-profile-head" id="admin-ai-provider-head">
        <span class="admin-avatar admin-avatar--lg admin-skeleton"></span>
      </div>
      <nav class="admin-tabs" id="admin-ai-provider-tabs" aria-label="Sections de la fiche fournisseur"></nav>
      <div class="admin-tab-panel" id="admin-ai-provider-panel"></div>
    </template>

    <!-- Contenu du module Journal (voir admin-journal.js) — historique en lecture
     seule, générique à toute l'administration : IA, Abonnements, Analytics,
     Sauvegardes et Finance (Stripe, lecture seule) — voir ACTIONS dans
     admin_ai_log_service.py pour la liste complète. Renommé "Journal
     d'administration" (chantier de simplification du panneau admin) : le
     nom "Journal d'activité IA" ne reflétait plus que les actions du module
     IA, alors que la majorité des événements journalisés aujourd'hui viennent
     d'autres modules. Réutilise le composant table déjà utilisé par le
     module Utilisateurs (.admin-users-table). -->
    <template id="admin-journal-template">
      <div class="admin-page-head">
        <h1>Journal d'administration</h1>
        <p class="admin-page-lead">
          Historique complet de toutes les actions d'administration (IA, Abonnements, Analytics, Sauvegardes, Finance).
        </p>
      </div>
      <div class="admin-users-toolbar">
        <div class="admin-users-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input
            type="search"
            id="admin-journal-search-input"
            placeholder="Rechercher un administrateur, un fournisseur, une erreur…"
            aria-label="Rechercher dans le journal"
          />
        </div>
        <div class="admin-users-filters">
          <select id="admin-journal-filter-admin" aria-label="Filtrer par administrateur"></select>
          <select id="admin-journal-filter-provider" aria-label="Filtrer par fournisseur"></select>
          <select id="admin-journal-filter-action" aria-label="Filtrer par action"></select>
          <select id="admin-journal-filter-result" aria-label="Filtrer par résultat"></select>
          <!-- Chantier de simplification (audit utilité/densité) : les 2
           champs de date étaient isolés dans la grille de filtres, au même
           niveau que les selects — regroupés visuellement en un seul bloc
           "Période", les ids/comportement JS restent inchangés
           (admin-journal-filter-date-from/to). -->
          <div class="admin-form-checkbox-row" aria-label="Filtrer par période">
            <span>Période :</span>
            <input type="date" id="admin-journal-filter-date-from" aria-label="Depuis le" />
            <span aria-hidden="true">→</span>
            <input type="date" id="admin-journal-filter-date-to" aria-label="Jusqu'au" />
          </div>
        </div>
        <p class="admin-form-hint admin-form-hint--warning" id="admin-journal-filters-warning" hidden>
          <span id="admin-journal-filters-warning-text"></span>
          <button type="button" class="admin-btn admin-btn--sm" id="admin-journal-filters-retry">Réessayer</button>
        </p>
        <!-- Chantier de simplification : les 2 boutons "Exporter CSV"/
         "Exporter JSON" sont fusionnés en un seul contrôle (menu déroulant),
         réutilisant les classes .admin-kebab/.admin-kebab-menu déjà
         utilisées ailleurs dans l'admin (voir admin-settings.js) — les deux
         mécanismes techniques (redirection directe pour CSV, fetch+blob pour
         JSON, voir admin-journal.js) restent inchangés, seuls les ids des
         2 actions sont conservés. -->
        <div class="admin-journal-export-actions admin-kebab">
          <button
            type="button"
            class="admin-btn admin-btn--sm"
            id="admin-journal-export-toggle"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Exporter ▾
          </button>
          <div class="admin-kebab-menu" id="admin-journal-export-menu" hidden>
            <button type="button" class="admin-kebab-item" id="admin-journal-export-csv">Exporter en CSV</button>
            <button type="button" class="admin-kebab-item" id="admin-journal-export-json">Exporter en JSON</button>
          </div>
        </div>
      </div>
      <div class="admin-filter-chips" id="admin-journal-filter-chips" hidden></div>
      <div class="admin-users-table-wrap">
        <table class="admin-users-table">
          <thead>
            <tr id="admin-journal-thead-row"></tr>
          </thead>
          <tbody id="admin-journal-tbody"></tbody>
        </table>
      </div>
      <p class="admin-empty" id="admin-journal-empty" hidden></p>
      <nav class="admin-users-pagination" id="admin-journal-pagination" aria-label="Pagination du journal"></nav>
    </template>

    <!-- Modale de détail d'une entrée de journal (anciennes/nouvelles valeurs). -->
    <div class="admin-modal-overlay" id="admin-journal-detail-modal" hidden>
      <div class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-journal-detail-modal-title">
        <div class="admin-modal-head">
          <h2 id="admin-journal-detail-modal-title">Détail de l'événement</h2>
          <button type="button" class="admin-modal-close" id="admin-journal-detail-modal-close" aria-label="Fermer">
            &times;
          </button>
        </div>
        <div id="admin-journal-detail-modal-body"></div>
      </div>
    </div>

    <!-- Contenu du module Support (voir admin-support.js) — tableau des tickets
     (recherche/filtres/tri/pagination, réutilise .admin-users-table déjà
     utilisé par Utilisateurs/Journal). Les vues "Vue d'ensemble" et "Tickets
     par catégorie" ont été retirées (doublons du Dashboard/Analytics et des
     filtres du tableau, voir chantier de simplification). -->
    <template id="admin-support-template">
      <div class="admin-page-head">
        <h1>Support</h1>
        <p class="admin-page-lead">Gestion des tickets de support envoyés par les utilisateurs.</p>
      </div>

      <section class="admin-section" aria-labelledby="admin-support-tickets-title">
        <h2 class="admin-section-title" id="admin-support-tickets-title">Tickets</h2>
        <div class="admin-users-toolbar">
          <div class="admin-users-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              type="search"
              id="admin-support-search-input"
              placeholder="Rechercher un sujet, un email…"
              aria-label="Rechercher un ticket"
            />
          </div>
          <div class="admin-users-filters">
            <select id="admin-support-filter-status" aria-label="Filtrer par statut"></select>
            <select id="admin-support-filter-category" aria-label="Filtrer par catégorie"></select>
            <select id="admin-support-filter-priority" aria-label="Filtrer par priorité"></select>
            <select id="admin-support-filter-assigned" aria-label="Filtrer par administrateur assigné"></select>
          </div>
          <p class="admin-form-hint admin-form-hint--warning" id="admin-support-assigned-warning" hidden>
            <span id="admin-support-assigned-warning-text"></span>
            <button type="button" class="admin-btn admin-btn--sm" id="admin-support-assigned-retry">Réessayer</button>
          </p>
        </div>
        <div class="admin-users-table-wrap">
          <table class="admin-users-table">
            <thead>
              <tr id="admin-support-thead-row"></tr>
            </thead>
            <tbody id="admin-support-tbody"></tbody>
          </table>
        </div>
        <p class="admin-empty" id="admin-support-empty" hidden></p>
        <nav class="admin-users-pagination" id="admin-support-pagination" aria-label="Pagination des tickets"></nav>
      </section>
    </template>

    <!-- Contenu du sous-chemin /admin/support/:id — fiche ticket complète (voir
     admin-support-ticket.js) : conversation, pièces jointes, notes internes,
     historique, statut, assignation, réponse rapide. -->
    <template id="admin-support-ticket-template">
      <div class="admin-page-head" id="admin-support-ticket-head"></div>

      <div class="admin-support-ticket-layout">
        <div class="admin-support-ticket-main">
          <section class="admin-section" aria-labelledby="admin-support-ticket-conversation-title">
            <h2 class="admin-section-title" id="admin-support-ticket-conversation-title">Conversation</h2>
            <div id="admin-support-ticket-messages"></div>
            <form class="admin-form-grid" id="admin-support-ticket-reply-form">
              <div class="admin-form-field admin-form-field--full">
                <label class="admin-form-label" for="admin-support-ticket-reply-body">Réponse rapide</label>
                <textarea
                  class="admin-form-textarea"
                  id="admin-support-ticket-reply-body"
                  rows="3"
                  placeholder="Écrire une réponse à l'utilisateur…"
                ></textarea>
              </div>
              <div class="admin-form-field admin-form-field--full">
                <input type="file" id="admin-support-ticket-reply-files" multiple />
              </div>
              <button type="submit" class="admin-btn admin-btn--primary">Envoyer la réponse</button>
            </form>
          </section>

          <section class="admin-section" aria-labelledby="admin-support-ticket-notes-title">
            <h2 class="admin-section-title" id="admin-support-ticket-notes-title">Notes internes</h2>
            <p class="admin-form-hint">Visibles uniquement par l'administration, jamais par l'utilisateur.</p>
            <ul class="admin-unavailable-list" id="admin-support-ticket-notes-list"></ul>
            <form class="admin-form-grid" id="admin-support-ticket-note-form">
              <div class="admin-form-field admin-form-field--full">
                <textarea
                  class="admin-form-textarea"
                  id="admin-support-ticket-note-body"
                  rows="2"
                  placeholder="Ajouter une note interne…"
                ></textarea>
              </div>
              <button type="submit" class="admin-btn admin-btn--secondary">Ajouter la note</button>
            </form>
          </section>

          <section class="admin-section" aria-labelledby="admin-support-ticket-history-title">
            <h2 class="admin-section-title" id="admin-support-ticket-history-title">Historique</h2>
            <ul class="admin-unavailable-list" id="admin-support-ticket-history-list"></ul>
          </section>
        </div>

        <aside class="admin-support-ticket-side">
          <div class="admin-form-field">
            <label class="admin-form-label" for="admin-support-ticket-status-select">Statut</label>
            <select class="admin-form-select" id="admin-support-ticket-status-select"></select>
          </div>
          <div class="admin-form-field">
            <label class="admin-form-label" for="admin-support-ticket-assign-select">Administrateur assigné</label>
            <select class="admin-form-select" id="admin-support-ticket-assign-select"></select>
            <p class="admin-form-hint admin-form-hint--warning" id="admin-support-ticket-assign-warning" hidden>
              <span id="admin-support-ticket-assign-warning-text"></span>
              <button type="button" class="admin-btn admin-btn--sm" id="admin-support-ticket-assign-retry">
                Réessayer
              </button>
            </p>
          </div>
        </aside>
      </div>
    </template>

    <!-- Contenu du module Santé du système (voir admin-health.js) — centre de
     supervision : vue d'ensemble, services, fournisseurs IA, clés API,
     disponibilité, graphiques (Chart.js), base SQLite, stockage, serveur,
     incidents, explorateur de logs, alertes. Réutilise .admin-cards/
     .admin-card/.admin-ai-health-list/.admin-unavailable-list déjà utilisés
     par les modules IA/Support — aucun nouveau composant générique. -->
    <!-- Le contenu repliable (Résumé/Services/IA/Base de données/Serveur/Alertes)
     est entièrement généré par admin-health.js via
     createCollapseSection()/admin-collapse.js — même composant transverse que
     les autres modules à sections repliables — afin de restaurer l'état

    <template id="admin-health-template">

    <!-- Contenu du module Paramètres (voir admin-settings.js) — centre de
     configuration : Général/Comptes/Apparence (éditables, persistés dans
     system_settings), IA/Clés API/SMTP/Stripe/Sauvegardes/Sécurité/Logs/
     Performance (lecture, réutilise les services déjà existants). Réutilise
     .admin-cards/.admin-card/.admin-toggle/.admin-form-*/.admin-btn déjà
     utilisés par IA/Abonnements/Support — aucun nouveau composant générique. -->
    <template id="admin-settings-template">
      <div class="admin-page-head">
        <h1>Paramètres</h1>
        <!-- Audit admin (2026-10-22), point 4 : bandeau "enforced:false"
         retiré — vérifié dans settings_service.py::SETTINGS_SCHEMA, plus
         aucun réglage n'est `enforced:False` aujourd'hui, le texte était
         devenu obsolète. -->
        <p class="admin-page-lead">Centre de configuration de Mathadap.</p>
        <div class="admin-settings-toolbar">
          <div class="admin-settings-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />

            <input
              type="search"
              id="admin-settings-search-input"
              placeholder="Rechercher un paramètre…"
              aria-label="Rechercher un paramètre"

      <!-- Audit admin (2026-10-22), point 1 (Paramètres) : le système de
       favoris (étoile par catégorie + filtre + localStorage) a été retiré —
       disproportionné pour seulement 4 catégories, un simple repli suffit
       (voir admin-settings.js::CATEGORIES/buildCategories). La recherche
       texte est conservée (utile pour retrouver un champ précis). Chaque
       catégorie est construite en JS (admin-settings.js::buildCategories)
       via createCollapseSection (admin-collapse.js) — jamais de <section>
       fixe. -->
      <div id="admin-settings-categories"></div>
    </template>

    <!-- Contenu du module Analytics (voir admin-analytics.js) — FONDATIONS
     uniquement (cartes KPI filtrables par période) : graphiques/exports/
     classements suivront dans un chantier ultérieur. Réutilise .admin-cards/

    <template id="admin-analytics-template">

        </p>
      </div>

      <div class="admin-users-toolbar admin-analytics-no-print">
        <div class="admin-users-filters">
          <select class="admin-form-select" id="admin-analytics-window-select" aria-label="Période"></select>
          <input type="date" id="admin-analytics-date-from" aria-label="Depuis le" hidden />

          <button type="button" class="admin-btn admin-btn--sm" id="admin-analytics-save-view-btn">

        <div class="admin-users-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

        class="admin-section"
        id="admin-analytics-pinned-section"
        hidden
        aria-labelledby="admin-analytics-pinned-title"

        <h2 class="admin-section-title" id="admin-analytics-pinned-title">KPI épinglés</h2>
        <div class="admin-cards" id="admin-analytics-pinned"></div>
      </section>

      <!-- Export + Rapports fusionnés en UNE SEULE UI (Chantier Analytics,
       2026-10-22) — avant : 3 boutons "Exporter CSV/Excel/PDF" dans la
       barre d'outils + une section "Rapports" séparée (même historique
       sous-jacent, voir admin_analytics_export_service.list_export_history,
       déjà fusionné côté backend). "Imprimer" a été retiré (doublon
       fonctionnel confirmé avec l'export PDF serveur, qui fait mieux : mise
       en page dédiée, graphiques vectoriels réels, pas une capture de la
       page web). La case "Conserver dans l'historique" détermine SEUL le
       comportement du bouton : décochée (défaut) = export ponctuel de la
       période actuellement affichée (comportement de l'ancien bouton
       "Exporter", jamais écrit sur disque) ; cochée = génère un rapport
       PERSISTÉ (comportement de l'ancienne section "Rapports", avec son
       propre sélecteur de période car un rapport garde un sens même après
       un changement de la période affichée à l'écran) — les deux restent
       visibles dans le même tableau d'historique ci-dessous, aucune
       fonction de traçabilité perdue. -->
      <section class="admin-section admin-analytics-no-print" aria-labelledby="admin-analytics-export-title">
        <h2 class="admin-section-title" id="admin-analytics-export-title">Export</h2>
        <form class="admin-form-grid" id="admin-analytics-export-form">
          <div class="admin-form-field">
            <label class="admin-form-label" for="admin-analytics-export-format">Format</label>
            <select class="admin-form-select" id="admin-analytics-export-format">
              <option value="pdf" selected>PDF</option>
              <option value="xlsx">Excel</option>
              <option value="csv">CSV</option>
            </select>
          </div>
          <div class="admin-form-field" id="admin-analytics-export-report-type-field" hidden>
            <label class="admin-form-label" for="admin-analytics-export-report-type">Période du rapport</label>
            <select class="admin-form-select" id="admin-analytics-export-report-type">
              <option value="quotidien">Quotidien</option>
              <option value="hebdomadaire">Hebdomadaire</option>
              <option value="mensuel" selected>Mensuel</option>
              <option value="annuel">Annuel</option>
              <option value="personnalise">Personnalisé</option>
            </select>
          </div>
          <div class="admin-form-field admin-analytics-export-keep-field">
            <label class="admin-form-label" for="admin-analytics-export-keep-checkbox">
              <input type="checkbox" id="admin-analytics-export-keep-checkbox" />
              Conserver dans l'historique (téléchargeable plus tard)
            </label>
          </div>
          <button type="submit" class="admin-btn admin-btn--primary" id="admin-analytics-export-submit-btn">
            Exporter
          </button>
        </form>
        <div class="admin-users-table-wrap">
          <table class="admin-users-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Administrateur</th>
                <th>Type</th>
                <th>Format</th>
                <th>Taille</th>
                <th>Durée</th>
                <th>Résultat</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-analytics-reports-tbody"></tbody>
          </table>
        </div>
        <p class="admin-empty" id="admin-analytics-reports-empty" hidden>Aucun export/rapport n'a encore été généré.</p>
      </section>

      <!-- Les 3 graphiques "Croissance quotidienne/mensuelle/annuelle"
       (même métrique d'inscriptions, 3 granularités) ont été fusionnés en
       UN SEUL graphique + un sélecteur de granularité (Chantier Analytics,
       2026-10-22) — toutes les données restent accessibles, juste via le
       sélecteur plutôt que 3 blocs simultanés. -->
      <section class="admin-section" aria-labelledby="admin-analytics-users-title">
        <h2 class="admin-section-title" id="admin-analytics-users-title">Utilisateurs</h2>
        <div class="admin-form-field admin-analytics-no-print">
          <label class="admin-form-label" for="admin-analytics-users-granularity-select">Granularité</label>

            <option value="monthly">Mois</option>
            <option value="yearly">Année</option>
          </select>
        </div>
        <div class="admin-health-charts-grid" id="admin-analytics-users-charts"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-analytics-chatbot-title">
        <h2 class="admin-section-title" id="admin-analytics-chatbot-title">Chatbot</h2>
        <div class="admin-health-charts-grid" id="admin-analytics-chatbot-charts"></div>
        <h3 class="admin-analytics-subtitle">Classements</h3>
        <div class="admin-analytics-rankings-grid" id="admin-analytics-chatbot-rankings"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-analytics-ai-title">
        <h2 class="admin-section-title" id="admin-analytics-ai-title">IA</h2>
        <div class="admin-health-charts-grid" id="admin-analytics-ai-charts"></div>
        <h3 class="admin-analytics-subtitle">Classements</h3>
        <div class="admin-analytics-rankings-grid" id="admin-analytics-ai-rankings"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-analytics-support-title">
        <h2 class="admin-section-title" id="admin-analytics-support-title">Support</h2>
        <div class="admin-health-charts-grid" id="admin-analytics-support-charts"></div>
        <h3 class="admin-analytics-subtitle">Classements</h3>
        <div class="admin-analytics-rankings-grid" id="admin-analytics-support-rankings"></div>
      </section>
    </template>

    <!-- Contenu du module Abonnements (voir admin-subscriptions.js) — les 3 plans
     Mathadap (Free/Premium/Ultra) + statistiques réelles + l'assignation des
     fournisseurs IA par plan (déplacée ici depuis le module IA — voir
     admin-collapse.js pour la section repliable ci-dessous, seul endroit où
     cette information existe désormais). -->
    <template id="admin-subscriptions-template">
      <div class="admin-page-head">
        <h1>Abonnements</h1>
        <p class="admin-page-lead">Administration du catalogue des abonnements Mathadap.</p>
      </div>

      <section class="admin-section" aria-labelledby="admin-subscriptions-plans-title">
        <h2 class="admin-section-title" id="admin-subscriptions-plans-title">Plans</h2>
        <p class="admin-form-hint">
          Le nombre d'utilisateurs par plan (champ local <code>plan</code>) diffère des abonnements Stripe actifs et des
          indicateurs agrégés (nouveaux abonnements, résiliations, MRR estimé), tous centralisés dans le module
          <a href="/admin/finance">Finance</a> (réservé SUPER_ADMIN) — voir la réconciliation ci-dessous en cas d'écart.
        </p>
        <div class="admin-cards admin-ai-providers-grid" id="admin-subscriptions-plans"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-subscriptions-stripe-reconcile-title">
        <h2 class="admin-section-title" id="admin-subscriptions-stripe-reconcile-title">Réconciliation Stripe</h2>
        <p class="admin-form-hint">
          Compare, en LECTURE SEULE, le statut d'abonnement stocké localement au statut réel renvoyé par Stripe pour
          chaque compte — ne modifie jamais ni la base ni Stripe. Une divergence signale un webhook manqué ou un
          changement effectué directement dans le Dashboard Stripe.
        </p>
        <div id="admin-subscriptions-stripe-environment"></div>
        <button type="button" class="admin-btn" id="admin-subscriptions-reconcile-btn">
          Lancer une réconciliation (lecture seule)
        </button>
        <div id="admin-subscriptions-reconcile-result"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-subscriptions-ai-title">
        <h2 class="admin-section-title" id="admin-subscriptions-ai-title">Fournisseurs IA par plan</h2>
        <p class="admin-form-hint">
          Quels fournisseurs IA (configurés depuis la page <a href="/admin/ia">IA</a>) sont utilisés par chaque plan.
          L'ordre d'utilisation suit la priorité globale du fournisseur.
        </p>
        <div id="admin-subscriptions-ai-assignment"></div>
      </section>
    </template>

    <template id="admin-finance-template">
      <div class="admin-page-head">
        <h1>Finance</h1>
        <p class="admin-page-lead">
          Tableau de bord financier Mathadap — abonnements/MRR calculés localement (instantanés), revenus/paiements lus
          en direct depuis Stripe sur demande explicite (lecture seule, jamais automatique).
        </p>
        <p class="admin-form-hint" id="admin-finance-last-refresh"></p>
        <button type="button" class="admin-btn admin-btn--sm" id="admin-finance-retry-btn" hidden>Réessayer</button>
      </div>

      <section class="admin-section" aria-labelledby="admin-finance-env-title">
        <h2 class="admin-section-title" id="admin-finance-env-title">Source des données</h2>
        <div id="admin-finance-stripe-environment"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-finance-subs-title">
        <h2 class="admin-section-title" id="admin-finance-subs-title">Abonnements</h2>
        <p class="admin-form-hint">
          Les chiffres ci-dessous mesurent les abonnements Stripe réellement actifs (dernier statut webhook connu
          <code>active</code>/<code>trialing</code>) — une mesure différente du nombre d'utilisateurs par plan affiché
          dans le module <a href="/admin/subscriptions">Abonnements</a> (champ <code>plan</code> du compte, pas
          nécessairement synchronisé en temps réel) : les deux sont légitimes, ce ne sont pas des doublons.
        </p>
        <div class="admin-cards" id="admin-finance-subscriptions"></div>
      </section>

      <section class="admin-section" aria-labelledby="admin-finance-revenue-title">
        <h2 class="admin-section-title" id="admin-finance-revenue-title">Revenus (Stripe, lecture seule)</h2>
        <!-- Audit admin (2026-10-22) : quand Stripe n'est pas accessible en
         lecture (non_configure/etat_inconnu/reconciliation_blocked), cette
         zone compacte remplace entièrement les contrôles ci-dessous (jamais
         les deux affichés ensemble) — voir wireFinanceButtons/
         isFinanceUnavailable dans admin-finance.js, qui bascule .hidden sur
         les deux blocs selon stripe_environment. Évite de réserver les 240px
         du graphique (.admin-health-chart-box, ajoutée dynamiquement par JS
         UNIQUEMENT quand une série est réellement rendue) tant qu'aucune
         donnée n'est disponible. -->
        <div id="admin-finance-revenue-unavailable" hidden></div>
        <div id="admin-finance-revenue-controls">
          <p class="admin-form-hint">
            Revenu brut = factures payées sur la période. Net = brut moins remboursements UNIQUEMENT (jamais net des
            frais Stripe, non calculé dans cette phase). Chaque clic déclenche un véritable appel à Stripe.
          </p>
          <label class="admin-form-label" for="admin-finance-period" id="admin-finance-period-label">Période</label>
          <select id="admin-finance-period" class="admin-form-select">
            <option value="30">30 derniers jours</option>
            <option value="90">90 derniers jours</option>
            <option value="365">12 derniers mois</option>
          </select>
          <button type="button" class="admin-btn" id="admin-finance-revenue-btn">Charger les revenus (Stripe)</button>
          <div id="admin-finance-revenue-result"></div>
          <div id="admin-finance-revenue-chart"></div>
        </div>
      </section>

      <section class="admin-section" aria-labelledby="admin-finance-payments-title">
        <h2 class="admin-section-title" id="admin-finance-payments-title">
          Derniers paiements (Stripe, lecture seule)
        </h2>
        <button type="button" class="admin-btn" id="admin-finance-payments-btn">
          Charger les derniers paiements (Stripe)
        </button>
        <div id="admin-finance-payments-result"></div>
      </section>
    </template>

    <!-- Module "Fréquentation" (/admin/frequentation) — Phase 2 Cloudflare (audit
     admin, 2026-10-21). Fréquentation du SITE (Cloudflare Web Analytics),
     jamais les comptes/l'activité Mathadap (voir module "Analytics" pour
     cela) — distinction toujours visible via le texte d'introduction et les
     libellés de section. Même design que les autres modules (admin-card/
     admin-section/admin-health-chart-box), aucun nouveau style créé. -->
    <template id="admin-frequentation-template">
      <div class="admin-page-head">
        <h1>Fréquentation</h1>
        <p class="admin-page-lead">
          Statistiques de fréquentation du site mathadap.com, mesurées par Cloudflare Web Analytics (cookie-free) —
          distinctes des comptes et de l'activité Mathadap (voir le module Analytics pour cela). Ce qui n'est pas encore
          disponible est signalé explicitement, jamais deviné ni approximé.
        </p>
      </div>

      <div class="admin-users-toolbar">
        <div class="admin-users-filters">
          <select class="admin-form-select" id="admin-frequentation-window-select" aria-label="Période"></select>
        </div>
      </div>
      <p class="admin-form-hint" id="admin-frequentation-sampling-note" hidden></p>
      <p class="admin-form-error" id="admin-frequentation-error" hidden></p>

      <!-- État vide groupé (non configuré / erreur API / zéro réel confirmé) —
       remplace les 3 sections détaillées ci-dessous quand aucune métrique
       n'a de donnée réelle (voir computeEmptyState() dans admin-frequentation.js) ;

      <article class="admin-card admin-frequentation-empty-state" id="admin-frequentation-empty-state" hidden>
        <div class="admin-card-label" id="admin-frequentation-empty-state-title"></div>

        <button type="button" class="admin-btn admin-btn--sm" id="admin-frequentation-empty-state-retry" hidden>
          Réessayer
        </button>
      </article>

      <div id="admin-frequentation-detail">
        <section class="admin-section" aria-labelledby="admin-frequentation-overview-title">
          <h2 class="admin-section-title" id="admin-frequentation-overview-title">Vue d'ensemble</h2>
          <div class="admin-cards" id="admin-frequentation-overview-cards"></div>
        </section>

        <section class="admin-section" aria-labelledby="admin-frequentation-evolution-title">
          <h2 class="admin-section-title" id="admin-frequentation-evolution-title">Évolution quotidienne</h2>
          <div class="admin-health-chart-box" id="admin-frequentation-evolution-chart"></div>
        </section>

        <section class="admin-section" aria-labelledby="admin-frequentation-rankings-title">
          <h2 class="admin-section-title" id="admin-frequentation-rankings-title">Classements</h2>
          <div class="admin-cards" id="admin-frequentation-rankings"></div>
        </section>
      </div>
    </template>

    <!-- Contenu du sous-chemin /admin/subscriptions/:plan — fiche détaillée d'un

     "IA" a été retiré (miroir en lecture seule de la section "Fournisseurs IA

     renvoie directement. Réutilise le même gabarit DOM que la fiche
     fournisseur IA (mêmes ids #admin-ai-provider-*) : un seul jeu de
     styles/scripts de fiche à onglets dans tout le projet, jamais un second

    <template id="admin-subscription-detail-template">
      <div class="admin-user-profile-head" id="admin-subscription-detail-head">
        <span class="admin-avatar admin-avatar--lg admin-skeleton"></span>
      </div>
      <nav class="admin-tabs" id="admin-subscription-detail-tabs" aria-label="Sections de la fiche abonnement"></nav>
      <div class="admin-tab-panel" id="admin-subscription-detail-panel"></div>
    </template>

    <!-- Modale de confirmation générique, réutilisable par tout le panneau admin
     (voir admin-ui-kit.js::confirmDialog) — remplace window.confirm() natif
     pour les actions destructrices (restaurer/supprimer une sauvegarde,
     etc.), un seul composant partagé plutôt qu'une modale par page. -->
    <div class="admin-modal-overlay" id="admin-confirm-modal" hidden>
      <div
        class="admin-modal admin-modal--sm"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="admin-confirm-modal-title"

          <h2 id="admin-confirm-modal-title"></h2>
          <button type="button" class="admin-modal-close" id="admin-confirm-modal-close" aria-label="Fermer">
            &times;
          </button>
        </div>
        <p class="admin-modal-text" id="admin-confirm-modal-text"></p>
        <div class="admin-modal-foot">
          <button type="button" class="admin-btn" id="admin-confirm-modal-cancel">Annuler</button>
          <button type="button" class="admin-btn admin-btn--danger" id="admin-confirm-modal-confirm">Confirmer</button>
        </div>
      </div>
    </div>

    <!-- Notification de succès/erreur, réutilisable par tout le panneau admin
     (voir admin-ui-kit.js::showToast). -->
    <div class="admin-toast" id="admin-toast" hidden></div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
